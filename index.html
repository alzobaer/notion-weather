<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hamamatsu Weather</title>
<!-- Notion weather widget. Data: Open-Meteo (free, no key).
     URL options: ?theme=dark|light (default: follows the system)
                  &name=Hamamatsu&lat=34.71&lon=137.73 -->
<style>
  :root {            /* light: matches Notion light pages */
    --bg: #ffffff; --card: #f7f7f5; --ink: #37352f; --muted: #787774;
    --line: #e9e9e7; --accent: #2e7d6b; --rain: #2f80ed;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191919; --card: #202020; --ink: #e6e6e4; --muted: #9b9a97;
      --line: #2f2f2f; --accent: #5fc4a8; --rain: #6aa9ff;
    }
  }
  :root[data-theme="dark"] {   /* matches Notion dark pages */
    --bg: #191919; --card: #202020; --ink: #e6e6e4; --muted: #9b9a97;
    --line: #2f2f2f; --accent: #5fc4a8; --rain: #6aa9ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 13px/1.3 "Segoe UI", system-ui, -apple-system, "Hiragino Sans", sans-serif; }
  /* the card fills the whole embed height; the 7 day rows share the space */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px 8px; max-width: 380px; margin: 0 auto; height: 100%;
    display: flex; flex-direction: column; }
  .days { flex: 1; display: flex; flex-direction: column; }
  .days li { flex: 1; min-height: 24px; }
  .top { display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  /* clock on the left, current weather on the right */
  .now { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 6px 0 8px; border-bottom: 1px solid var(--line); }
  .clock { border-right: 1px solid var(--line); padding-right: 12px; }
  .clock .hm { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .clock .ss { font-size: 14px; color: var(--muted); font-weight: 400; }
  .clock .dt { font-size: 11px; color: var(--muted); }
  .wx { text-align: right; }
  .wx .row { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
  .now .ic { font-size: 24px; line-height: 1; }
  .now .tp { font-size: 26px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .now .cd { color: var(--muted); font-size: 11px; }
  .days { list-style: none; margin: 0; padding: 2px 0 0; }
  .days li { display: grid; grid-template-columns: 3.4em 1.8em 1fr auto; align-items: center; gap: 6px;
    border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .days li:last-child { border-bottom: 0; }
  .d { font-weight: 600; }
  .i { font-size: 17px; text-align: center; }
  .p { font-size: 11px; color: var(--rain); }
  .t { white-space: nowrap; }
  .t .lo { color: var(--muted); }
  .foot { text-align: right; font-size: 10px; color: var(--muted); padding-top: 4px; }
  .foot a { color: var(--muted); text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <div class="top"><span id="place">Hamamatsu</span><span>Updated <span id="upd">–</span></span></div>
  <div class="now">
    <div class="clock">
      <div class="hm"><span id="hm">--:--</span><span class="ss" id="ss">:--</span></div>
      <div class="dt" id="dt">&nbsp;</div>
    </div>
    <div class="wx">
      <div class="row"><span class="ic" id="nowIcon">·</span><span class="tp" id="nowTemp">--</span></div>
      <div class="cd" id="nowCond">Loading…</div>
    </div>
  </div>
  <ul class="days" id="days"></ul>
  <div class="foot"><a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get("theme") === "dark" || q.get("theme") === "light") document.documentElement.dataset.theme = q.get("theme");
  const NAME = q.get("name") || "Hamamatsu";
  const LAT = q.get("lat") || "34.71", LON = q.get("lon") || "137.73";
  const W = {
    0:["☀️","🌙","Clear sky"], 1:["🌤️","🌙","Mainly clear"], 2:["⛅","☁️","Partly cloudy"], 3:["☁️","☁️","Overcast"],
    45:["🌫️","🌫️","Fog"], 48:["🌫️","🌫️","Rime fog"],
    51:["🌦️","🌧️","Light drizzle"], 53:["🌦️","🌧️","Drizzle"], 55:["🌧️","🌧️","Heavy drizzle"],
    56:["🌧️","🌧️","Freezing drizzle"], 57:["🌧️","🌧️","Freezing drizzle"],
    61:["🌦️","🌧️","Light rain"], 63:["🌧️","🌧️","Rain"], 65:["🌧️","🌧️","Heavy rain"],
    66:["🌧️","🌧️","Freezing rain"], 67:["🌧️","🌧️","Freezing rain"],
    71:["🌨️","🌨️","Light snow"], 73:["🌨️","🌨️","Snow"], 75:["❄️","❄️","Heavy snow"], 77:["🌨️","🌨️","Snow grains"],
    80:["🌦️","🌧️","Rain showers"], 81:["🌧️","🌧️","Rain showers"], 82:["⛈️","⛈️","Violent showers"],
    85:["🌨️","🌨️","Snow showers"], 86:["🌨️","🌨️","Snow showers"],
    95:["⛈️","⛈️","Thunderstorm"], 96:["⛈️","⛈️","Thunderstorm, hail"], 99:["⛈️","⛈️","Thunderstorm, hail"]
  };
  const w = c => W[c] || ["🌡️","🌡️","—"];
  const r = n => Math.round(n) + "°";

  async function load() {
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON +
      "&current=temperature_2m,weather_code,is_day" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
      "&timezone=Asia%2FTokyo&forecast_days=7";
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status);
      const j = await res.json();
      const c = j.current, cw = w(c.weather_code);
      document.getElementById("place").textContent = NAME;
      document.getElementById("nowIcon").textContent = c.is_day ? cw[0] : cw[1];
      document.getElementById("nowTemp").textContent = Math.round(c.temperature_2m) + " °C";
      document.getElementById("nowCond").textContent = cw[2];
      const ul = document.getElementById("days"); ul.textContent = "";
      j.daily.time.forEach((t, k) => {
        const day = new Date(t + "T00:00:00").toLocaleDateString("en-US", { weekday: "short" });
        const pp = j.daily.precipitation_probability_max[k];
        const li = document.createElement("li");
        li.innerHTML = '<span class="d"></span><span class="i"></span><span class="p"></span>' +
          '<span class="t"><span class="hi"></span> <span class="lo"></span></span>';
        li.querySelector(".d").textContent = k === 0 ? "Today" : day;
        li.querySelector(".i").textContent = w(j.daily.weather_code[k])[0];
        li.querySelector(".i").title = w(j.daily.weather_code[k])[2];
        li.querySelector(".p").textContent = pp != null ? "💧" + pp + "%" : "";
        li.querySelector(".hi").textContent = r(j.daily.temperature_2m_max[k]);
        li.querySelector(".lo").textContent = "/ " + r(j.daily.temperature_2m_min[k]);
        ul.appendChild(li);
      });
      document.getElementById("upd").textContent =
        new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    } catch (e) {
      document.getElementById("nowCond").textContent = "Weather unavailable, retrying soon";
    }
  }
  // live clock in Japan time
  function tick() {
    const now = new Date();
    const p = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Tokyo", hour: "2-digit", minute: "2-digit",
      second: "2-digit", hour12: false }).formatToParts(now);
    const g = t => p.find(x => x.type === t).value;
    document.getElementById("hm").textContent = g("hour") + ":" + g("minute");
    document.getElementById("ss").textContent = ":" + g("second");
    document.getElementById("dt").textContent = now.toLocaleDateString("en-US",
      { timeZone: "Asia/Tokyo", weekday: "short", month: "short", day: "numeric" });
  }
  tick();
  setInterval(tick, 1000);

  load();
  setInterval(load, 30 * 60 * 1000);
</script>
</body>
</html>
